name: Update Stats Cards
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
push:
    branches: [main]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - name: Generate Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: akyourowngames
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: UTC
          filename: github-stats.svg # Saved directly in root
          
      - name: Generate Languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: akyourowngames
          template: classic
          base: ""
          plugin_languages: yes
          plugin_languages_limit: 8
          filename: top-langs.svg # Saved directly in root
