name: Snake

on:
  schedule:
    - cron: "0 0 * * *"   # every day at 00:00 UTC
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3.5.0
        with:
          github_user_name: akyourowngames
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            metrics/snake-dark.svg?palette=github-dark
            metrics/snake-light.svg?palette=github-light

      - name: Commit snake animation
        uses: EndBug/add-and-commit@v9
        with:
          add: metrics
          message: "chore(snake): refresh contribution animation [skip ci]"
          default_author: github_actions
